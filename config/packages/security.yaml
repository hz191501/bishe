security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
            logout:
                path: app_logout
                target: app_home

    access_control:
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/category/new$, roles: ROLE_ADMIN }
        - { path: ^/category/\d+/edit$, roles: ROLE_ADMIN }
        - { path: ^/category/\d+$, roles: ROLE_ADMIN, methods: [POST] }
        - { path: ^/bridge/task/new$, roles: ROLE_USER }
        - { path: ^/bridge/task/\d+/edit$, roles: ROLE_USER }
        - { path: ^/bridge/task/\d+$, roles: ROLE_USER, methods: [POST] }
        - { path: ^/risposte, roles: ROLE_USER }
        - { path: ^/commenti-risposta, roles: ROLE_USER }
        - { path: ^/mi-piace, roles: ROLE_USER }
        - { path: ^/amici-di-penna, roles: ROLE_USER }
        - { path: ^/notifiche, roles: ROLE_USER }
        - { path: ^/profilo/(modifica|password)$, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10